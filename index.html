<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fc4c02" />
    <title>routeGPX — draw a route, get a GPX</title>
    <style>
      html, body, #root { margin: 0; height: 100%; font-family: system-ui, sans-serif; overscroll-behavior: none; }
      #map { position: absolute; inset: 0; }
      #map.drawing { cursor: crosshair; }

      /* Mobile first: bottom sheet in thumb reach. */
      .panel {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
        display: flex; flex-direction: column; gap: 10px;
        background: #fff; border-radius: 16px 16px 0 0;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        box-shadow: 0 -2px 16px rgba(0, 0, 0, .2);
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .seg { display: flex; flex: 2; }
      .seg button { flex: 1; border-radius: 0; }
      .seg button:first-child { border-radius: 10px 0 0 10px; }
      .seg button:last-child { border-radius: 0 10px 10px 0; border-left: 0; }
      .panel button, .panel label.btn {
        font: inherit; font-size: 15px; min-height: 44px; padding: 0 10px;
        border: 1px solid #ccc; border-radius: 10px; background: #f6f6f6; color: #222;
        cursor: pointer; display: flex; align-items: center; justify-content: center; white-space: nowrap;
      }
      .panel button:disabled { opacity: .45; cursor: default; }
      .panel .on, .panel .primary { background: #fc4c02; border-color: #fc4c02; color: #fff; }
      .panel .primary { font-weight: 600; flex: 2; }
      .status { color: #444; font-size: 14px; min-height: 1.3em; }
      .detail { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #666; }
      .detail input { flex: 1; min-height: 32px; accent-color: #fc4c02; }
      /* Leaflet's attribution would hide under the sheet. */
      .leaflet-bottom { bottom: 190px; }

      .handle {
        display: flex !important; align-items: center; justify-content: center;
        background: #fff; border: 2px solid #333; border-radius: 50%;
        font-size: 20px; box-shadow: 0 1px 6px rgba(0, 0, 0, .35); touch-action: none;
      }
      .handle.scale { border-color: #fc4c02; color: #fc4c02; }

      @media (min-width: 720px) {
        .panel { top: 12px; left: 12px; right: auto; bottom: auto; width: 380px; border-radius: 16px; padding: 14px; }
        .leaflet-bottom { bottom: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
